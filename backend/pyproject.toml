[project]
name = "overcoding-backend"
version = "0.1.0"
description = "OverCoding — backend API for the gamified programming learning platform"
requires-python = ">=3.12,<3.14"

dependencies = [
    # web
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "python-multipart>=0.0.20,<0.1",
    # data
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",          # async driver for the app
    "psycopg[binary]>=3.2,<4.0",   # sync driver for alembic
    "pydantic[email]>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    # cache and queue
    "redis>=5.2,<6.0",
    "arq>=0.26,<1.0",
    # auth
    "pyjwt>=2.10,<3.0",
    "argon2-cffi>=23.1,<24.0",
    # outbound calls (code execution sandbox, external APIs)
    "httpx>=0.28,<0.29",
    # observability
    "structlog>=24.4,<26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "testcontainers[postgres,redis]>=4.9,<5.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "types-redis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF"]
ignore = [
    "S101",    # assert — допустим в тестах
    "RUF001",  # документация намеренно на русском; кириллица в строках — не ошибка
    "RUF002",
    "RUF003",
    "A003",    # `id` как атрибут модели — нормальная практика SQLAlchemy, не затенение builtin
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI объявляет зависимости значениями по умолчанию — для него это идиома, не ошибка.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path",
    "fastapi.Body", "fastapi.Header", "fastapi.Cookie", "fastapi.File", "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]              # тестовые учётные данные в коде — норма
"alembic/env.py" = ["E402"]               # импорты после правки sys.path — требование alembic
"app/schemas/auth.py" = ["S105"]          # ложное срабатывание на `token_type = "bearer"`
# Ниже — заглушки, которые удаляются целиком на своих фазах; форматировать их незачем:
"app/api/routers/ai.py" = ["E501"]        # мок ИИ, заменяется в фазе ИИ
"app/services/hints.py" = ["E501"]        # заглушка подсказок, заменяется лестницей подсказок

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "arq.*"]
ignore_missing_imports = true

# Строгая типизация включена для нового кода. Унаследованные модули (роутеры,
# сервисы, самописный auth) переписываются на своих фазах — тогда и снимаются
# послабления, по одному модулю за раз. Список должен только сокращаться.
[[tool.mypy.overrides]]
module = [
    "app.api.routers.*",
    "app.services.*",
    "app.auth.*",
    "app.models.*",
    "app.schemas.*",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: обращается к внешним сервисам (Judge0, Postgres, Redis)",
]

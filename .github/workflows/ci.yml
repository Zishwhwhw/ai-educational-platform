name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Секрет только для CI: база одноразовая, наружу не смотрит.
  SECRET_KEY: ci-secret-key-not-used-anywhere-else-0123456789
  ENVIRONMENT: development

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: overcoding
          POSTGRES_PASSWORD: overcoding
          POSTGRES_DB: overcoding
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U overcoding -d overcoding"
          --health-interval 5s --health-timeout 3s --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://overcoding:overcoding@localhost:5432/overcoding
      DATABASE_URL_SYNC: postgresql+psycopg://overcoding:overcoding@localhost:5432/overcoding
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        # --frozen: сборка падает, если uv.lock разошёлся с pyproject.toml.
        run: uv sync --frozen --python 3.12 --extra dev

      - name: Lint
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy .

      - name: Tests
        run: uv run pytest --cov=app --cov-report=term-missing

      - name: Migrations apply and roll back cleanly
        # Откат проверяется намеренно: миграция, которую нельзя откатить,
        # обнаруживается в проде, а не здесь.
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Schema matches models
        # Пустой автогенерируемый diff означает, что модели и миграции не разошлись.
        run: |
          uv run alembic revision --autogenerate -m "ci drift check" --rev-id cidrift
          # Без этой проверки упавший alembic давал бы "успех": grep по
          # несуществующему файлу возвращает 1, и шаг проходил бы молча.
          test -f alembic/versions/cidrift_ci_drift_check.py || {
            echo "::error::Миграция не сгенерирована — проверка недействительна"; exit 1; }
          if grep -qE "op\.(create|drop|alter|add)" alembic/versions/cidrift_ci_drift_check.py; then
            echo "::error::Модели разошлись с миграциями — не хватает миграции"
            cat alembic/versions/cidrift_ci_drift_check.py
            exit 1
          fi
          echo "Расхождений нет"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
